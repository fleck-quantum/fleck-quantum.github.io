<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consortium · Fleck</title>
<meta name="description" content="The eight Swiss partners of the Fleck consortium.">
<meta property="og:title" content="Fleck: quantum computing for the life sciences">
<meta property="og:description" content="An eight-party all-Swiss consortium applying quantum computing to contrast agent discovery, drug design and ULF-MRI brain cancer detection.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #d76fc9;
  --pink-soft: #f3cdec;
  --green: #4ca22f;
  --green-soft: #b8e4a8;
  --orange: #ec6a2a;
  --grey: #e8e8e8;
  --ink: #111;
  --muted: #5b5b5b;
  --bg: #fff;
  --max: 1080px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 17px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1; }
a { color: inherit; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

/* Nav */
nav {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
  border-bottom: 1px solid #f0f0f0;
}
nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { font-weight: 800; font-size: 21px; text-decoration: none; letter-spacing: -.01em; color: var(--pink); }
nav ul { list-style: none; display: flex; gap: 26px; margin: 0; padding: 0; }
nav ul a { text-decoration: none; font-weight: 500; font-size: 15px; color: var(--muted); }
nav ul a:hover, nav ul a.active { color: var(--ink); }
nav ul a.active { font-weight: 600; }

/* Hero */
.hero { padding: 48px 0 24px; }
.hero .wrap { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.hero h1 {
  font-weight: 800; font-size: clamp(32px, 4.2vw, 52px); line-height: 1.06;
  letter-spacing: -.025em; margin: 0 0 20px; max-width: 14ch; position: relative;
}
.hero h1 span { color: var(--pink); }
.hero p.lead {
  font-size: 17px; color: #333; max-width: 34em; margin: 0; position: relative;
}
.hero .tag {
  display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); margin-bottom: 14px; position: relative;
}
.blobs { flex: 0 0 auto; width: 340px; height: 360px; pointer-events: none; display: block; }
.hero-text { position: relative; z-index: 1; max-width: 580px; }

/* Sections */
section { padding: 56px 0; }
section + section { border-top: 1px solid #f0f0f0; }
h2 {
  font-weight: 800; font-size: clamp(26px, 3vw, 34px); letter-spacing: -.02em;
  line-height: 1.1; margin: 0 0 12px;
}
.section-intro { color: var(--muted); max-width: 40em; margin: 0 0 28px; }

/* Page header (sub-pages) */
.prose { max-width: 40em; }
.prose p { margin: 0 0 16px; }
.page-head { position: relative; padding-top: 48px; padding-bottom: 8px; }
.page-head h1 {
  font-weight: 800; font-size: clamp(30px, 3.4vw, 40px); letter-spacing: -.02em;
  line-height: 1.1; margin: 0 0 10px;
}
.page-head p { color: var(--muted); margin: 0; max-width: 40em; }
.page-head .flecks { position: absolute; right: 24px; top: 36px; }
.page-body { padding-top: 32px; padding-bottom: 56px; }

/* Partners */
.partners { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.partner {
  display: flex; align-items: center; justify-content: center;
  height: 104px; padding: 18px; border-radius: 20px; background: #fafafa;
  transition: background .2s;
}
.partner:hover { background: var(--grey); }
.partner img { max-width: 78%; max-height: 40px; object-fit: contain; }
.partner img.tall { max-height: 60px; }
.partner img[src*="zuriq"] { max-height: 46px; }

/* News */
.news-empty {
  border: 2px dashed var(--grey); border-radius: 24px; padding: 32px; color: var(--muted); text-align: center;
}

/* Contact */
.contact-box {
  background: var(--pink-soft); border-radius: 32px; padding: 44px; position: relative; overflow: hidden;
}
.contact-box h2 { position: relative; }
.contact-box p { position: relative; margin: 0 0 8px; max-width: 34em; }
.contact-box a.mail {
  display: inline-block; margin-top: 14px; font-weight: 600; text-decoration: none;
  background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 999px; position: relative;
}
.contact-box .c1 { position: absolute; right: -40px; bottom: -60px; width: 200px; height: 200px; border-radius: 50%; background: var(--green); opacity: .9; }
.contact-box .c2 { position: absolute; right: 150px; top: 24px; width: 26px; height: 26px; border-radius: 50%; background: var(--orange); }

footer { padding: 32px 0 44px; color: var(--muted); font-size: 14px; border-top: 1px solid #f0f0f0; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .partners { grid-template-columns: repeat(2, 1fr); }
  .blobs { width: 240px; height: 255px; }
  .page-head .flecks { display: none; }
  nav ul { gap: 18px; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .wrap { padding: 0 16px; }
  nav ul { gap: 14px; }
  nav ul a { font-size: 14px; }
  .hero { padding: 40px 0 48px; }
  .blobs { display: none; }
  section { padding: 44px 0; }
  .contact-box { padding: 32px 24px; }
  .partner { height: 88px; }
}

/* Dropdown */
nav li.has-menu { position: relative; }
nav .menu-btn {
  background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  font-weight: 500; font-size: 15px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
}
nav .menu-btn:hover, nav .menu-btn.active { color: var(--ink); }
nav .menu-btn.active { font-weight: 600; }
nav .menu-btn svg { transition: transform .2s; }
nav .submenu {
  position: absolute; top: calc(100% + 14px); left: -14px; min-width: 170px;
  list-style: none; margin: 0; padding: 8px; display: none; flex-direction: column; gap: 0;
  background: #fff; border: 1px solid #eee; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
}
nav .submenu::before { content: ""; position: absolute; left: 0; right: 0; top: -16px; height: 16px; }
nav .submenu a { display: block; padding: 8px 12px; border-radius: 8px; }
nav .submenu a:hover { background: #f6f6f6; }
nav li.has-menu:hover .submenu, nav li.has-menu:focus-within .submenu, nav li.has-menu.open .submenu { display: flex; }
nav li.has-menu:hover .menu-btn svg, nav li.has-menu.open .menu-btn svg { transform: rotate(180deg); }

/* News list */
.news-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid #eee; }
.news-list li { display: flex; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee; }
.news-list .when { flex: 0 0 auto; font-size: 14px; font-weight: 600; color: var(--pink); min-width: 92px; }

/* Funding */
.funding { padding: 36px 0; }
.funding .wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.funding .funders { display: flex; align-items: center; gap: 24px; flex: 0 0 auto; }
.funding img { height: 34px; width: auto; display: block; }
.funding img.sqi { height: 40px; }
.funding p { margin: 0; color: var(--muted); font-size: 15px; }

/* Project page */
.project-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 48px; align-items: start; }
.project-grid figure { margin: 0; }
.project-grid figure img { width: 100%; height: auto; display: block; border-radius: 16px; border: 1px solid #eee; }
.project-grid figcaption { font-size: 14px; color: var(--muted); margin-top: 10px; }

/* Contact page */
.people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 760px; }
.person { background: #fafafa; border-radius: 20px; padding: 24px 26px; }
.person h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
.person a { font-weight: 600; color: var(--ink); text-decoration-color: var(--pink); text-underline-offset: 3px; word-break: break-all; }

.placeholder { border: 2px dashed var(--grey); border-radius: 24px; padding: 32px; color: var(--muted); text-align: center; max-width: 760px; }

@media (max-width: 860px) {
  .project-grid { grid-template-columns: 1fr; gap: 32px; }
}
@media (max-width: 560px) {
  .people { grid-template-columns: 1fr; }
  .news-list li { flex-direction: column; gap: 2px; }
  nav .submenu { left: auto; right: -40px; }
}

/* Learn */
.topic-banner {
  background: var(--pink-soft); border-radius: 28px; padding: 28px; position: relative; overflow: hidden;
}
.topic-banner .dot1 { position: absolute; right: -30px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: var(--green-soft); }
.topic-banner .dot2 { position: absolute; right: 110px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); }
.topics { position: relative; display: flex; flex-wrap: wrap; gap: 10px; }
.topics a {
  display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
  background: #fff; color: var(--ink); padding: 10px 18px; border-radius: 999px;
  border: 1px solid rgba(0,0,0,.06); transition: background .2s, color .2s;
}
.topics a:hover { background: var(--ink); color: #fff; }
.coming-soon { margin: 28px 0 0; color: var(--muted); }

/* Consortium page */
.map-fig { margin: 0; }
.map-fig img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html">Fleck</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li class="has-menu">
        <button class="menu-btn active" type="button" aria-haspopup="true" aria-expanded="false">About <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <ul class="submenu">
          <li><a href="project.html">Project</a></li>
          <li><a href="researchers.html">People</a></li>
          <li><a href="consortium.html" class="active" aria-current="page">Consortium</a></li>
        </ul>
      </li>
      <li><a href="learn.html">Learn</a></li>
      <li><a href="index.html#news">News</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="wrap page-head">
    <svg class="flecks" width="150" height="70" viewBox="0 0 150 70" aria-hidden="true">
      <circle cx="30" cy="30" r="26" fill="#b8e4a8"/>
      <circle cx="96" cy="18" r="14" fill="#f3cdec"/>
      <circle cx="122" cy="52" r="9" fill="#ec6a2a"/>
      <circle cx="74" cy="56" r="6" fill="#4ca22f"/>
    </svg>
    <h1>The consortium</h1>
    <p>Three partners from academia and five from industry, across Switzerland.</p>
  </div>

  <div class="wrap page-body">
    <figure class="map-fig">
      <img src="map.png" alt="Map of Switzerland showing the Fleck partners: Novartis, Phoeniqs, QuantumBasel and Universität Basel in Basel; ZuriQ and ETH Zürich in Zurich; Université de Fribourg in Fribourg; and Multiwave Technologies in Geneva.">
    </figure>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Fleck consortium</span>
    <span>Quantum computing for the life sciences</span>
  </div>
</footer>

<script>
  // Tap-to-open for the About dropdown on touch screens
  document.querySelectorAll('nav .has-menu').forEach(function (li) {
    var btn = li.querySelector('.menu-btn');
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = li.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('nav .has-menu.open').forEach(function (li) {
      li.classList.remove('open');
      li.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
    });
  });
</script>
</body>
</html>
